name: keepalive

# GitHub turns off scheduled workflows after 60 days without repo activity. Re-enabling them
# through the API resets that clock without a commit. This workflow re-enables itself too.
on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for workflow in uptime.yml keepalive.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$workflow/enable"
          done
        env:
          GH_TOKEN: ${{ github.token }}
