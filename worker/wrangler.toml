name = "z5-uptime-alerts"
main = "index.js"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [{ pattern = "status.z5.gg", custom_domain = true }]

[assets]
directory = "../site"
binding = "ASSETS"
run_worker_first = ["/history.json"]

[triggers]
# alerts every minute; index.js also runs the full check on every fifth minute
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "STATE"
id = "2510a660cf7f478384fdaece6dd42f50"

[observability]
enabled = true
